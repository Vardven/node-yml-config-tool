name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download mihomo core (Windows x64)
        run: |
          New-Item -ItemType Directory -Force -Path core | Out-Null
          Invoke-WebRequest -Uri "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-windows-amd64-v1.19.34.zip" -OutFile core.zip
          Expand-Archive -Path core.zip -DestinationPath core-unzip -Force
          Move-Item (Get-ChildItem core-unzip -Filter *.exe | Select-Object -First 1).FullName core/mihomo-windows-x64.exe
          Remove-Item core.zip, core-unzip -Recurse -Force

      - name: Build Electron app for Windows x64 (NSIS + portable)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Download mihomo core (Windows ARM64)
        run: |
          Remove-Item core/* -Force
          Invoke-WebRequest -Uri "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-windows-arm64-v1.19.34.zip" -OutFile core.zip
          Expand-Archive -Path core.zip -DestinationPath core-unzip -Force
          Move-Item (Get-ChildItem core-unzip -Filter *.exe | Select-Object -First 1).FullName core/mihomo-windows-arm64.exe
          Remove-Item core.zip, core-unzip -Recurse -Force

      - name: Build Electron app for Windows ARM64 (NSIS + portable)
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis portable --arm64 --publish never

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
          if-no-files-found: error

      - name: Attach EXE to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
