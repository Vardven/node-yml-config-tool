name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -1)"
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install dependencies
        run: npm install

      - name: Add Android platform and sync
        run: |
          npx cap add android
          npx cap sync android

      - name: Set Android version from package.json
        run: |
          VER=$(node -p "require('./package.json').version")
          CODE=$(node -e "const p=process.argv[1].split('.').map(Number); console.log(p[0]*10000+p[1]*100+p[2])" "$VER")
          echo "versionName=$VER versionCode=$CODE"
          sed -i "s/versionCode [0-9]*/versionCode $CODE/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Enable ABI split APKs
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          // --- ABI splits injected by CI: per-ABI APKs + universal ---
          android {
              splits {
                  abi {
                      enable true
                      reset()
                      include 'armeabi-v7a', 'arm64-v8a', 'x86_64'
                      universalApk true
                  }
              }
          }
          def abiCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86_64': 3]
          android.applicationVariants.all { variant ->
              variant.outputs.all { output ->
                  def abi = output.getFilter(com.android.build.OutputFile.ABI)
                  if (abi != null) {
                      output.versionCodeOverride = android.defaultConfig.versionCode * 10 + abiCodes[abi]
                  }
              }
          }
          GRADLE

      - name: Build debug APK and unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER="$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"
          ZIPALIGN="$(dirname "$APKSIGNER")/zipalign"
          mkdir -p "$RUNNER_TEMP/signed"
          for UNSIGNED in android/app/build/outputs/apk/release/*-unsigned.apk; do
            NAME="$(basename "$UNSIGNED" -unsigned.apk).apk"
            echo "Signing $UNSIGNED -> $NAME"
            "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            "$APKSIGNER" sign --ks "$RUNNER_TEMP/release.jks" --ks-pass "pass:$STORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$RUNNER_TEMP/signed/$NAME" "$RUNNER_TEMP/aligned.apk"
            "$APKSIGNER" verify "$RUNNER_TEMP/signed/$NAME" > /dev/null && echo "Verified $NAME"
          done
          ls -l "$RUNNER_TEMP/signed"

      - name: Collect APKs
        run: |
          mkdir -p apk-out
          cp android/app/build/outputs/apk/debug/app-universal-debug.apk apk-out/app-debug.apk
          cp "$RUNNER_TEMP/signed/app-universal-release.apk" apk-out/app-release.apk
          cp "$RUNNER_TEMP/signed/app-arm64-v8a-release.apk" apk-out/
          cp "$RUNNER_TEMP/signed/app-armeabi-v7a-release.apk" apk-out/
          cp "$RUNNER_TEMP/signed/app-x86_64-release.apk" apk-out/
          ls -l apk-out

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            apk-out/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apk-out/*.apk
