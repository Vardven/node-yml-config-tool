name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Download mihomo core (macOS x64)
        run: |
          mkdir -p core
          curl -sfL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-darwin-amd64-v1.19.34.gz" | gunzip > core/mihomo-darwin-x64
          chmod +x core/mihomo-darwin-x64

      - name: Build Electron app for macOS x64 (DMG, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --x64 --publish never

      - name: Download mihomo core (macOS arm64)
        run: |
          rm -f core/*
          curl -sfL "https://github.com/MetaCubeX/mihomo/releases/download/v1.19.34/mihomo-darwin-arm64-v1.19.34.gz" | gunzip > core/mihomo-darwin-arm64
          chmod +x core/mihomo-darwin-arm64

      - name: Build Electron app for macOS arm64 (DMG, unsigned)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: Upload DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: |
            dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
